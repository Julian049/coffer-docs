<style>
  body { font: 12px Inter, sans-serif; margin: 12px; }
  #log { width: 100%; height: 270px; font: 11px monospace; white-space: pre-wrap; overflow: auto; border: 1px solid #E4E7E3; border-radius: 8px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 6px 12px; }
</style>
<div id="status">Aplicando cambios…</div>
<div id="log"></div>
<button id="copy">Copiar registro</button>
<button id="close">Cerrar</button>
<script>
  const log = document.getElementById("log");
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (m.line) { log.textContent += m.line + "\n"; log.scrollTop = log.scrollHeight; }
    if (m.done) document.getElementById("status").textContent = m.done;
  };
  document.getElementById("copy").onclick = () => {
    const r = document.createRange(); r.selectNodeContents(log);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy");
  };
  document.getElementById("close").onclick = () => parent.postMessage({ pluginMessage: "close" }, "*");
</script>
