<style>
  body { font: 12px Inter, sans-serif; margin: 12px; }
  textarea { width: 100%; height: 300px; font: 11px monospace; }
  button { margin-top: 8px; padding: 6px 12px; }
</style>
<div id="status">Leyendo el archivo…</div>
<textarea id="out" readonly></textarea>
<button id="dl">Descargar .txt</button>
<button id="copy">Copiar</button>
<button id="close">Cerrar</button>
<script>
  const out = document.getElementById("out");
  onmessage = (e) => {
    const { text, lines } = e.data.pluginMessage;
    out.value = text;
    document.getElementById("status").textContent = "Listo: " + lines + " líneas. Descarga el archivo y guárdalo en la carpeta del proyecto.";
  };
  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out.value], { type: "text/plain" }));
    a.download = "figma-estructura.txt";
    a.click();
  };
  document.getElementById("copy").onclick = () => { out.select(); document.execCommand("copy"); };
  document.getElementById("close").onclick = () => parent.postMessage({ pluginMessage: "close" }, "*");
</script>
